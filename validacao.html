<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Validação de Cadastro</title>
  <link rel="stylesheet" href="validacao.css">
</head>
<body>

  <div class="container">
    <h2>Cadastro</h2>

    <label>Email</label>
    <input type="email" id="email">
    <div class="error" id="emailError"></div>

    <label>Senha</label>
    <input type="password" id="senha">

    <label>Confirmar Senha</label>
    <input type="password" id="confirmarSenha">
    <div class="error" id="senhaError"></div>

    <div class="buttons">
      <button class="next" onclick="validar()">Avançar</button>
      <button class="remove" onclick="limpar()">Remover</button>
    </div>
  </div>

  <script src="validacao.js"></script>
</body>
</html>
